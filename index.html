<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MangaVerse — Design System Foundation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint. Keep in sync with ThemeContext.jsx.
      // Saved "light" | "dark" | "system"; anything else (or no storage) means light.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('mv-theme');
          if (
            saved === 'dark' ||
            (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            theme = 'dark';
          }
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
